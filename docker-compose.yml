version: '3.8'

services:
  # Main application service
  shopify-theme-detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopify-theme-detector-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_DEBUG=False
      - PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount blog posts for easy content updates
      - ./blog:/app/blog:ro
      # Mount i18n files for translation updates
      - ./i18n:/app/i18n:ro
      # Mount logs directory
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shopify-detector-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Nginx reverse proxy for production-like setup
  nginx:
    image: nginx:alpine
    container_name: shopify-theme-detector-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - shopify-theme-detector
    restart: unless-stopped
    networks:
      - shopify-detector-network

networks:
  shopify-detector-network:
    driver: bridge