version: '3.8'

services:
  # Production application service
  shopify-theme-detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopify-theme-detector-prod
    ports:
      - "5000:5000"
    environment:
      - FLASK_DEBUG=False
      - PORT=5000
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
    volumes:
      # Read-only mounts for production
      - ./blog:/app/blog:ro
      - ./i18n:/app/i18n:ro
      # Writable logs directory
      - ./logs:/app/logs
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - prod-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Nginx reverse proxy with SSL termination
  nginx:
    image: nginx:alpine
    container_name: shopify-theme-detector-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - shopify-theme-detector
    restart: always
    networks:
      - prod-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'

  # Redis for caching (optional)
  redis:
    image: redis:alpine
    container_name: shopify-theme-detector-redis
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - prod-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.1'

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: shopify-theme-detector-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped
    networks:
      - prod-network

networks:
  prod-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-data: